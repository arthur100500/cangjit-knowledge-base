<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">x86-64 managed JIT stack frame and external metadata</title>
<desc id="desc">Stack grows down. The frame contains a caller return address, saved frame pointer, entry plus nine marker, slots and optional padding. The marker identifies code entry, whose preceding four-byte relative offset identifies an external descriptor.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#40566e"/></marker></defs>
<rect width="1000" height="530" fill="#fff"/><g font-family="sans-serif" fill="#172b3a"><text x="40" y="38" font-size="23" font-weight="bold">Managed JIT frame, after prologue</text><text x="40" y="65" font-size="15">x86-64 Linux; higher addresses at top</text>
<g stroke="#40566e" fill="#edf4fa"><rect x="130" y="90" width="340" height="55"/><rect x="130" y="145" width="340" height="55"/><rect x="130" y="200" width="340" height="55"/><rect x="130" y="255" width="340" height="55"/><rect x="130" y="310" width="340" height="55"/><rect x="130" y="365" width="340" height="55"/></g>
<g font-size="16"><text x="145" y="123">caller return address</text><text x="145" y="178">saved caller rbp</text><text x="145" y="233">entry + 9 marker (code address)</text><text x="145" y="288">allocation slot 0, if present</text><text x="145" y="343">allocation slot 1, if present</text><text x="145" y="398">more slots / alignment padding</text><text x="40" y="123">rbp + 8</text><text x="57" y="178">rbp</text><text x="45" y="233">rbp - 8</text><text x="37" y="288">rbp - 16</text><text x="37" y="343">rbp - 24</text><text x="132" y="455">rsp after prologue (frame size varies)</text><text x="40" y="492">stack grows down ↓</text></g>
<g stroke="#40566e" fill="#fff8e6"><rect x="590" y="120" width="365" height="80"/><rect x="590" y="265" width="365" height="90"/></g><g font-size="16"><text x="605" y="147">entry = marker − 9</text><text x="605" y="173">entry − 4: signed 32-bit offset</text><text x="605" y="296">external descriptor + stack map</text><text x="605" y="322">and optional exception table</text></g>
<path d="M470 225 C530 225 520 176 585 176" fill="none" stroke="#40566e" stroke-width="2" marker-end="url(#arrow)"/><path d="M770 200 L770 260" fill="none" stroke="#40566e" stroke-width="2" marker-end="url(#arrow)"/><text x="484" y="213" font-size="13">find entry</text><text x="782" y="236" font-size="13">relative link</text></g></svg>
